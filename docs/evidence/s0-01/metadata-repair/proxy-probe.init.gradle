gradle.settingsEvaluated {
    ['http', 'https'].each { scheme ->
        def host = System.getProperty("${scheme}.proxyHost")
        def port = System.getProperty("${scheme}.proxyPort")
        if (host != '127.0.0.1' || port != '7897') {
            throw new GradleException("Expected approved ${scheme} proxy at 127.0.0.1:7897")
        }
        logger.lifecycle("[metadata-repair] Gradle JVM ${scheme} proxy: ${host}:${port}")
    }
}
