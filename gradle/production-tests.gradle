// production-tests.gradle
//
// Fixed production-test task names for the S5 release protocol. Every task
// reuses the existing Loom sourceSets/runs (runServerSmoke, runServerSmokeProduction,
// runGameTest); no classpath is ever hand-assembled here. Test implementations,
// fault/fixture/agents never enter the main/client jars — they live only in the
// serverSmoke/gametest/test source sets which are wired into isolated runs, not
// into remapJar/sourcesJar.
//
// The GameTest subset selection is delegated to the existing
// `processGametestResources` `-PgreatwallGameTestClasses=` filter. Callers
// (tools/Test-S4Gallery.ps1, tools/Test-S5*.ps1) pass the subset property on the
// command line; the fixed-name tasks below only declare the dependency and the
// intent, never a second parallel test implementation.

// ---------------------------------------------------------------------------
// Server smoke / terrain matrix
// ---------------------------------------------------------------------------

tasks.register('runProductionServerSmoke') {
    group = 'verification'
    description = 'Production server smoke: isolated knot server, development=false'
    dependsOn tasks.named('runServerSmokeProduction')
}

tasks.register('runRealTerrainMatrix') {
    group = 'verification'
    description = 'Real terrain matrix (isolated server smoke with s0Terrain probes)'
    dependsOn tasks.named('runServerSmoke')
}

// ---------------------------------------------------------------------------
// Stage GameTest subsets (S2 road, S3 FTB/gameplay, S4 gallery)
// ---------------------------------------------------------------------------

tasks.register('runS2RoadTests') {
    group = 'verification'
    description = 'S2 Road interop GameTests'
    dependsOn tasks.named('runGameTest')
}

tasks.register('runS3FtbTests') {
    group = 'verification'
    description = 'S3 FTB/gameplay GameTests'
    dependsOn tasks.named('runGameTest')
}

tasks.register('runS4Gallery') {
    group = 'verification'
    description = 'S4 palette/visual gallery GameTests'
    dependsOn tasks.named('runGameTest')
}

// ---------------------------------------------------------------------------
// S5 fault recovery + stress
// ---------------------------------------------------------------------------
//
// These are REAL entry points, not aliases for a generic smoke run. A plain smoke run
// exercises none of the 18 fault points, neither exception/halt mode, nor a stress
// profile, so depending on one would let this gate report success without testing
// anything — which is exactly the defect this section used to have.
//
// The two shapes differ:
//   * Fault injection needs no server. FaultProcessMain is a self-contained child JVM
//     that reaches the Nth hit of one fault point and then throws or halts.
//   * Stress needs a live dedicated server, because the profile demands chunks, jumps
//     far and triggers reloads. It is therefore the ordinary isolated smoke server with
//     the stress fixture selected through the same probe properties every other fixture
//     uses; nothing about the runtime is re-implemented here.
//
// Both tasks fail on a missing or malformed parameter, so an under-specified
// invocation is a configuration error rather than a silent pass.

tasks.register('runS5Faults', JavaExec) {
    group = 'verification'
    description = 'S5 fault-injection: one isolated child JVM at one fault point (per-point driver: tools/Test-S5Faults.ps1)'
    dependsOn tasks.named('serverSmokeClasses')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('smokeJavaVersion').getOrElse('21').toInteger())
    }
    // The child resolves its workspace from the working directory and then requires the fault root to
    // be a strict descendant of <workspace>/build/fault-runs, so the working directory must be the
    // project root, not the fault-runs directory itself.
    workingDir = projectDir
    classpath = sourceSets.serverSmoke.runtimeClasspath
    mainClass = 'local.plaincraft.greatwall.stress.FaultProcessMain'
    doFirst {
        def required = ['greatwallFaultRoot', 'greatwallFaultPoint', 'greatwallFaultOccurrence', 'greatwallFaultMode']
        def missing = required.findAll { !project.hasProperty(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("runS5Faults requires -P${missing.join(', -P')}; " +
                    'use tools/Test-S5Faults.ps1 to drive the full matrix')
        }
        def mode = project.property('greatwallFaultMode').toString()
        if (!(mode in ['exception', 'halt'])) {
            throw new GradleException("greatwallFaultMode must be 'exception' or 'halt', found '${mode}'")
        }
        args '--root', project.property('greatwallFaultRoot').toString(),
                '--point', project.property('greatwallFaultPoint').toString(),
                '--occurrence', project.property('greatwallFaultOccurrence').toString(),
                '--mode', mode
        // halt mode is expected to terminate with 137 and exception mode with a non-zero code, so the
        // exit value must not be turned into a Gradle failure here. It must nevertheless be observable:
        // the driver asserts the exact expected code per mode, and a wrapper that always exits 0 hides
        // the child's real status from it. The code is captured in the doLast below, which is declared
        // outside this configuration block because a task may not gain actions once it has started.
        ignoreExitValue = true
        logger.lifecycle("S5 fault child: point=${project.property('greatwallFaultPoint')} " +
                "occurrence=${project.property('greatwallFaultOccurrence')} mode=${mode}")
    }
    // Written after the child exits, so the driver can read the real status rather than the wrapper's.
    // The directory name includes the mode: exception and halt runs of one point are separate
    // experiments and must not share a witness file.
    doLast {
        def witness = new File(project.property('greatwallFaultRoot').toString(),
                "${project.property('greatwallFaultPoint')}-${project.property('greatwallFaultOccurrence')}"
                        + "-${project.property('greatwallFaultMode')}/exit-code.txt")
        witness.parentFile.mkdirs()
        witness.setText(executionResult.get().exitValue.toString(), 'UTF-8')
    }
}

// Validates the request, then delegates to the ordinary isolated smoke server with the stress switch
// turned on. The switch lives in one place only — the smoke script's JVM-argument assembly — so there
// is exactly one definition of how the isolated server starts.
tasks.register('prepareS5Stress') {
    group = 'verification'
    description = 'Validates the S5 stress request before any server starts'
    doFirst {
        def hours = project.findProperty('greatwallStressHours')
        if (hours == null) {
            throw new GradleException('runS5Stress requires -PgreatwallStressHours; ' +
                    'use tools/Test-S5Stress.ps1 to drive the profile')
        }
        def hoursText = hours.toString()
        if (!(hoursText ==~ /[1-9][0-9]{0,2}/) || hoursText.toLong() > 24L) {
            throw new GradleException("greatwallStressHours must be 1..24, found '${hoursText}'")
        }
        // The server selects the stress fixture from s5Stress, and the fixture reads its duration from
        // s5StressMinutes. Validating only the driver's `hours` wording would let an invocation that
        // omits the actual switches pass this gate and then quietly run an ordinary smoke test, which
        // is precisely the "asked for stress, tested nothing" failure this task exists to prevent.
        def switchOn = project.findProperty('s5Stress')
        if (switchOn == null || switchOn.toString() != 'true') {
            throw new GradleException('runS5Stress requires -Ps5Stress=true so the server actually ' +
                    'selects the stress fixture; pass it together with -Ps5StressMinutes')
        }
        def minutesProp = project.findProperty('s5StressMinutes')
        if (minutesProp == null || minutesProp.toString() != (hoursText.toLong() * 60L).toString()) {
            throw new GradleException("runS5Stress requires -Ps5StressMinutes=${hoursText.toLong() * 60L} " +
                    "to match -PgreatwallStressHours=${hoursText}; found '${minutesProp}'")
        }
        logger.lifecycle("S5 stress profile armed: hours=${hoursText} minutes=${minutesProp}")
    }
}

tasks.register('runS5Stress') {
    group = 'verification'
    description = 'S5 stress: the isolated dedicated server running the MIXED_24H chunk-demand profile (driver: tools/Test-S5Stress.ps1)'
    // The profile IS the isolated smoke server with the stress fixture selected, so this task's only
    // job is to require the stress properties and hand off to that server. Gradle reads the
    // -Ps5Stress / -Ps5StressMinutes values that the driver passes; an invocation that omits them
    // fails in prepareS5Stress rather than silently running a normal smoke test.
    dependsOn tasks.named('prepareS5Stress'), tasks.named('runServerSmokeProduction')
}

// ---------------------------------------------------------------------------
// Release artifact verification
// ---------------------------------------------------------------------------

// Top-level helper: `File.digest(String)` is not part of the plain JDK File API, so calling it on a
// File reached through a task property fails at execution time. This computes the digest directly.
def sha256 = { File target ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    target.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        for (int count; (count = stream.read(buffer)) != -1;) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Release gate: version, dependency lock, jar contents, pack format'
    dependsOn tasks.named('remapJar'), tasks.named('sourcesJar')

    doLast {
        def errors = []
        def report = [:]

        // 1. Version gate: release is exactly 0.1.0, not a preview suffix.
        def version = project.mod_version
        report.version = version
        if (version != '0.1.0') {
            errors.add("mod_version must be exactly 0.1.0 for release, found '${version}'")
        }

        // 2. Dependency versions must remain frozen.
        def expected = [
            minecraft_version: '1.21.1',
            loader_version: '0.19.3',
            fabric_version: '0.116.14+1.21.1',
            junit_version: '5.11.0',
            junit_platform_version: '1.11.0'
        ]
        expected.each { key, want ->
            def have = project.findProperty(key)
            report[key] = have
            if (have != want) {
                errors.add("${key} must remain '${want}', found '${have}'")
            }
        }

        // 3. remapJar contents: no test/fault/fixture/agent classes, no credentials
        //    or machine paths.
        def remapJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def sourceJar = tasks.named('sourcesJar').get().archiveFile.get().asFile
        [remapJar, sourceJar].each { jar ->
            if (!jar.isFile()) {
                errors.add("missing artifact: ${jar.name}")
                return
            }
            def forbidden = [
                /local\/plaincraft\/greatwall\/gametest\//,
                /local\/plaincraft\/greatwall\/stress\//,
                /local\/plaincraft\/greatwall\/smoke\//,
                /net\/fabricmc\/fabric\/api\/gametest\//
            ]
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                zip.entries().each { entry ->
                    def name = entry.name
                    forbidden.each { pattern ->
                        if (name ==~ pattern || name.contains('FaultInjector') || name.contains('FaultProcessMain')
                                || name.contains('StressProcessMain') || name.contains('StressController')
                                || name.contains('StressFixture')) {
                            errors.add("forbidden test/fault class leaked into ${jar.name}: ${name}")
                        }
                    }
                    if (name.contains('C:\\') || name.contains('D:\\') || name.contains('/home/')) {
                        errors.add("machine path leaked into ${jar.name}: ${name}")
                    }
                }
            }
            report["${jar.name}.sha256"] = sha256(jar)
        }

        // 4. pack.mcmeta: pack_format=34, supported 34..48.
        def packMcmeta = file('src/main/resources/pack.mcmeta')
        def packJson = new groovy.json.JsonSlurper().parse(packMcmeta)
        def pack = packJson.pack
        report.pack_format = pack.pack_format
        report.supported_formats = pack.supported_formats
        if (pack.pack_format != 34) {
            errors.add("pack.mcmeta pack_format must be 34, found ${pack.pack_format}")
        }
        if (pack.supported_formats?.min_inclusive != 34 || pack.supported_formats?.max_inclusive != 48) {
            errors.add("pack.mcmeta supported_formats must be 34..48, found ${pack.supported_formats}")
        }

        def outputDir = layout.buildDirectory.dir('release').get().asFile
        outputDir.mkdirs()
        def result = [status: errors.isEmpty() ? 'PASS' : 'FAIL', errors: errors, report: report]
        new File(outputDir, 'verifyReleaseArtifacts.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result)), 'UTF-8')
        if (!errors.isEmpty()) {
            throw new GradleException("Release verification failed:\n  - " + errors.join("\n  - "))
        }
        logger.lifecycle("RELEASE ARTIFACTS VERIFIED: ${result.status}")
    }
}
