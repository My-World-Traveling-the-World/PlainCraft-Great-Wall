}
tasks.register('runClientSmokeProduction', JavaExec) {
    timeout = java.time.Duration.ofMinutes(5)
    dependsOn tasks.named('prepareServerSmoke'), tasks.named('remapJar'), remappedClientSmoke
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(runtimeJava) }
    workingDir = directory.get().asFile
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    jvmArgs '-Xmx8G', '-Dfabric.development=false', '-Dfabric.noGui=true', '-Dmixin.debug.export=true',
            '-Dmixin.debug.export.decompile=false'
    if (runtimeJava == 25) {
        jvmArgs '--enable-native-access=ALL-UNNAMED', '--add-modules=jdk.incubator.vector'
    }
    args '--version', '1.21.1', '--username', 'GreatWallSmoke', '--accessToken', '0',
            '--gameDir', directory.get().asFile.absolutePath, '--assetIndex', '1.21.1-17',
            '--assetsDir', new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets').absolutePath,
            '--width', '854', '--height', '480'
    doFirst {
        classpath = prepareProductionInputs(sourceSets.client, 'minecraft-client.jar',
                remappedClientSmoke.get().archiveFile.get().asFile)
        def root = directory.get().asFile
        new File(root, 'options.txt').setText('onboardAccessibility:false\nfullscreen:false\n', 'UTF-8')
        new File(root, 'production-client-classpath.txt').setText(
                classpath.files.collect { it.absolutePath }.sort().join('\n') + '\n', 'UTF-8')
        logger.lifecycle("Production client runtime: ${javaLauncher.get().metadata.installationPath}")
    }
}

// Manual isolated client: no smoke entrypoint that would automatically close the game.
def previewDirectory = layout.buildDirectory.dir('run/wallPreview')
def preparePreview = tasks.register('prepareWallPreview') {
    dependsOn tasks.named('remapJar')
    doLast {
        def root = previewDirectory.get().asFile
        def allowed = layout.buildDirectory.dir('run').get().asFile.canonicalFile
        if (!root.canonicalFile.toPath().startsWith(allowed.toPath())) {
            throw new GradleException('Preview must remain inside this project build/run directory')
        }
        def assetRoot = new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets')
        def index = new File(assetRoot, 'indexes/1.21.1-17.json')
        if (!index.isFile()) throw new GradleException('Local asset index missing; network downloads are forbidden')
        def manifest = new groovy.json.JsonSlurper().parse(index)
        manifest.objects.values().each { value ->
            def hash = value.hash
            if (!(hash ==~ /[0-9a-f]{40}/)) throw new GradleException('Invalid local asset object identity')
            def object = new File(assetRoot, "objects/${hash.substring(0, 2)}/${hash}")
            if (!object.isFile() || object.length() != value.size) {
                throw new GradleException("Local asset object missing: ${hash}; do not download")
            }
        }
        if (root.isDirectory() && !new File(root, 'greatwall_test_world').isFile()) {
            throw new GradleException('Refusing an existing unmarked preview directory')
        }
        root.mkdirs()
        new File(root, 'greatwall_test_world').setText('S1C manual isolated client; no real saves\n', 'UTF-8')
        new File(root, 'greatwall_s1c_fixture').setText('S1C isolated fixture authorization; production OFF\n', 'UTF-8')
        def runtime = prepareProductionInputs(sourceSets.client, 'minecraft-client.jar', null, root)
        def jar = tasks.named('remapJar').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jar.withInputStream { input ->
            byte[] buffer = new byte[65536]
            for (int count; (count = input.read(buffer)) != -1;) digest.update(buffer, 0, count)
        }
        def description = [javaHome: javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
                .get().metadata.installationPath.asFile.absolutePath,
                classpath: runtime.files.collect { it.absolutePath }, artifact: jar.name,
                artifactSha256: digest.digest().encodeHex().toString(),
                production: false, isolatedFixture: true, networkUsed: false,
                purpose: 'manual-client-preview-not-acceptance']
        new File(root, 'preview-runtime.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(description)), 'UTF-8')
        logger.lifecycle("PREVIEW PREPARED ONLY: ${root}; production OFF; no game started")
    }
}

tasks.register('runWallPreview', JavaExec) {
    dependsOn preparePreview
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = previewDirectory.get().asFile
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    jvmArgs '-Xmx8G', '-Dfabric.development=false', '-Dgreatwall.production=false',
            '-Dgreatwall.s1c.productionFixture=true', '-Dgreatwall.s0.probe=false'
    args '--version', '1.21.1', '--username', 'GreatWallPreview', '--accessToken', '0',
            '--gameDir', previewDirectory.get().asFile.absolutePath, '--assetIndex', '1.21.1-17',
            '--assetsDir', new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets').absolutePath
    doFirst {
        def description = new groovy.json.JsonSlurper().parse(new File(workingDir, 'preview-runtime.json'))
        classpath = files(description.classpath)
    }
}
