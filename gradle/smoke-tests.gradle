// Explicit test tasks only: never add the smoke mod to the production artifact.
sourceSets {
    serverSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}
// Pure diagnostic coordinate tests consume the test-only source set, never the production jar.
sourceSets.test.compileClasspath += sourceSets.serverSmoke.output
sourceSets.test.runtimeClasspath += sourceSets.serverSmoke.output

def profile = providers.gradleProperty('smokeProfile').getOrElse('vanilla')
def runId = providers.gradleProperty('smokeRunId').getOrElse(UUID.randomUUID().toString())
if (!(profile in ['vanilla', 'tectonic', 'tectonic-c2me', 'pack-opencl']) ||
        !(runId ==~ /[a-zA-Z0-9_-]{1,80}/)) {
    throw new GradleException('Invalid isolated smoke profile or run ID')
}
def directory = layout.buildDirectory.dir("run/serverSmoke/${profile}/${runId}")
def runtimeJava = providers.gradleProperty('smokeJavaVersion').getOrElse('21').toInteger()
def disableRewrite = providers.gradleProperty('s0DisableRewrite').getOrElse('false').toBoolean()
def terrainProbe = providers.gradleProperty('s0Terrain').getOrElse('false').toBoolean()
def terrainResume = providers.gradleProperty('s0TerrainResume').getOrElse('false').toBoolean()
def oracleOnly = providers.gradleProperty('s1cOracleOnly').getOrElse('false').toBoolean()
def realWall = providers.gradleProperty('s1cRealWall').getOrElse('false').toBoolean()
def realReopen = providers.gradleProperty('s1cReopen').getOrElse('false').toBoolean()
def seedSurvey = providers.gradleProperty('s1cSeedSurvey').getOrElse('false').toBoolean()
def actualSeed = providers.gradleProperty('s1cSeed').getOrElse('9282026')
// Real-wall traversal budget, shared by the fixture's own guard and the Gradle task timeout so the
// two can never disagree. Defaults to the certified 39 minutes.
def traversalMinutes = providers.gradleProperty('s1cTraversalMinutes').getOrElse('39').toLong()
if (!(actualSeed ==~ /-?[0-9]+/) || (realReopen && !realWall)) {
    throw new GradleException('Real fixture seed/reopen contract')
}
if (realWall && (oracleOnly || terrainProbe || disableRewrite || profile == 'pack-opencl' ||
        providers.gradleProperty('s0Probe').getOrElse('false').toBoolean())) {
    throw new GradleException('Real wall fixture is separate from S0/oracle and blocked full pack')
}
if (oracleOnly && (profile == 'pack-opencl' || terrainProbe ||
        providers.gradleProperty('s0Probe').getOrElse('false').toBoolean())) {
    throw new GradleException('S1C oracle certificate must be isolated from S0 probes and the blocked full pack')
}
if (disableRewrite && profile != 'tectonic-c2me') {
    throw new GradleException('Rewrite-disable capability test is isolated to the C2ME CPU profile')
}
if (seedSurvey && (profile != 'vanilla' || realWall || oracleOnly || terrainProbe || disableRewrite ||
        providers.gradleProperty('s0Probe').getOrElse('false').toBoolean())) {
    throw new GradleException('Seed survey is vanilla, read-only and separate from all production/S0 pipelines')
}
def probeArgs = [
    "-Dgreatwall.s1c.seedSurvey=${seedSurvey}",
    "-Dgreatwall.s1c.surveySeed=${actualSeed}",
    "-Dgreatwall.s1c.productionFixture=${realWall}",
    "-Dgreatwall.s1c.reopen=${realReopen}",
    "-Dgreatwall.s1c.oracle=${oracleOnly}",
    "-Dgreatwall.s0.probe=${providers.gradleProperty('s0Probe').getOrElse('false')}",
    "-Dgreatwall.s0.delayMs=${providers.gradleProperty('s0DelayMs').getOrElse('1')}",
    "-Dgreatwall.s0.outcome=${providers.gradleProperty('s0Outcome').getOrElse('SUCCESS')}",
    "-Dgreatwall.s0.reload=${providers.gradleProperty('s0Reload').getOrElse('none')}",
    "-Dgreatwall.s0.reloadWorldgen=${providers.gradleProperty('s0ReloadWorldgen').getOrElse('false')}",
    "-Dgreatwall.s0.entries=${providers.gradleProperty('s0Entries').getOrElse('false')}",
    "-Dgreatwall.s0.terrain=${terrainProbe}",
    "-Dgreatwall.s0.terrainRounds=${providers.gradleProperty('s0TerrainRounds').getOrElse('1')}",
    "-Dgreatwall.s0.terrainConcurrency=${providers.gradleProperty('s0TerrainConcurrency').getOrElse('1')}",
    "-Dgreatwall.s0.terrainOrder=${providers.gradleProperty('s0TerrainOrder').getOrElse('1')}",
    "-Dgreatwall.s0.terrainSkip=${providers.gradleProperty('s0TerrainSkip').getOrElse('false')}",
    "-Dgreatwall.s0.terrainPauseBeforeApply=${providers.gradleProperty('s0TerrainPauseBeforeApply').getOrElse('false')}",
    "-Dgreatwall.s0.terrainCrashAfterSave=${providers.gradleProperty('s0TerrainCrashAfterSave').getOrElse('false')}",
    "-Dgreatwall.s0.terrainResume=${terrainResume}",
    "-Dgreatwall.s0.terrainFixedWorkers=${providers.gradleProperty('s0TerrainFixedWorkers').getOrElse('false')}",
    "-Dgreatwall.s0.runId=${runId}",
    "-Dgreatwall.s0.disableRewrite=${disableRewrite}",
    "-Dgreatwall.s0.expectedFailure=${providers.gradleProperty('s0ExpectedFailure').getOrElse('false')}",
    "-Dgreatwall.s0.expectedAdapter=${!disableRewrite && (profile == 'tectonic-c2me' || profile == 'pack-opencl') ? 'c2me' : 'vanilla'}",
    // Real-wall traversal budget. Defaults to the certified 39 minutes; a full 505-owner traversal
    // needs more, so an explicit diagnostic run raises it and the fixture reports the value it used.
    "-Dgreatwall.s1c.traversalMinutes=${providers.gradleProperty('s1cTraversalMinutes').getOrElse('39')}",
    // S5 stress selection. Inert (false/0) for every ordinary smoke run; the runS5Stress entry point
    // requires these to be supplied, so the stress fixture is selected in exactly one place — here,
    // where all server JVM arguments are assembled — instead of by a second launcher definition.
    //
    // Concurrency is forwarded because -PgreatwallStressConcurrency was previously accepted by the
    // driver and then dropped here: a request for 16 ran at the fixture's hardcoded 8 without saying
    // so, and concurrency is the parameter the profile's shape depends on. The seed is forwarded only
    // when the driver supplies one, and is checked against the value server.properties actually
    // receives, so evidence cannot claim a seed the world does not have.
    "-Dgreatwall.s5.stress=${providers.gradleProperty('s5Stress').getOrElse('false')}",
    "-Dgreatwall.stress.minutes=${providers.gradleProperty('s5StressMinutes').getOrElse('0')}",
    "-Dgreatwall.stress.concurrency=${providers.gradleProperty('greatwallStressConcurrency').getOrElse('8')}"
]
def requestedStressSeed = providers.gradleProperty('greatwallStressSeed').orNull
if (requestedStressSeed != null) {
    if (requestedStressSeed != actualSeed) {
        throw new GradleException("greatwallStressSeed=${requestedStressSeed} does not match the world seed " +
                "that server.properties will carry (s1cSeed=${actualSeed}); set both or neither, so the " +
                "profile cannot record a seed it did not run on")
    }
    probeArgs.add("-Dgreatwall.stress.seed=${requestedStressSeed}")
}
def oracleMaxY = providers.gradleProperty('s1cExpectedMaxY').orNull
if (oracleMaxY != null) {
    if (!oracleOnly || !(oracleMaxY ==~ /[1-9][0-9]*/)) throw new GradleException('S1C expected maxY requires oracle diagnostic mode')
    probeArgs.add("-Dgreatwall.s1c.expectedMaxY=${oracleMaxY}")
}
// Diagnostic only: the representative-sample floor stays 1200 blocks unless a
// run explicitly lowers it, and any lowered run reports what it used.
def representativeBlocks = providers.gradleProperty('s1cRepresentativeBlocks').orNull
if (providers.gradleProperty('s1cProtectionTrace').getOrElse('false').toBoolean()) {
    if (!realWall) throw new GradleException('Protection tracing requires the isolated real wall fixture')
    probeArgs.add('-Dgreatwall.s1c.protectionTrace=true')
}
if (representativeBlocks != null) {
    if (!realWall || !(representativeBlocks ==~ /[1-9][0-9]*/)) {
        throw new GradleException('s1cRepresentativeBlocks requires the real wall fixture')
    }
    probeArgs.add("-Dgreatwall.s1c.representativeBlocks=${representativeBlocks}")
}
if (terrainProbe) probeArgs.add("-Dmax.bg.threads=${providers.gradleProperty('s0TerrainConcurrency').getOrElse('1')}")
if (providers.gradleProperty('s0TerrainFixedWorkers').getOrElse('false').toBoolean()) {
    if (!terrainProbe) throw new GradleException('Fixed workers are only permitted in the isolated terrain fixture')
    // Make the vanilla pool's CPU-derived ceiling high enough for the 16-worker test.
    probeArgs.add('-XX:ActiveProcessorCount=24')
}
if (disableRewrite) probeArgs.add('-Dfabric.debug.disableModIds=c2me-rewrites-chunk-system,c2me-notickvd')
if (!(runtimeJava in [21, 25]) || (runtimeJava != 21 && profile != 'pack-opencl')) {
    throw new GradleException('Only the existing OpenCL profile may opt into its required Java 25 runtime')
}
loom {
    mods {
        plaincraft_great_wall_server_smoke { sourceSet sourceSets.serverSmoke }
    }
    runs {
        serverSmoke {
            inherit server
            source sourceSets.serverSmoke
            runDir "build/run/serverSmoke/${profile}/${runId}"
            vmArg profile == 'pack-opencl' ? '-Xmx8G' : '-Xmx4G'
            vmArg "-Dgreatwall.smoke.profile=${profile}"
            vmArg '-Dfabric.noGui=true'
            vmArg '-Dmixin.debug.export=true'
            vmArg '-Dmixin.debug.export.decompile=false'
            if (oracleOnly) vmArg '-Xlog:gc,safepoint:file=oracle-vm.log:time,uptime,level,tags'
            probeArgs.each { vmArg it }
            if (runtimeJava == 25) {
                vmArg '--enable-native-access=ALL-UNNAMED'
                vmArg '--add-modules=jdk.incubator.vector'
            }
            programArgs '--nogui', '--port', '0', '--world', 'world'
        }
    }
}

tasks.register('prepareServerSmoke') {
    doLast {
        def root = directory.get().asFile
        if (realReopen) {
            if (!new File(root, 'greatwall_test_world').isFile() || !new File(root, 'greatwall_s1c_fixture').isFile() ||
                    !new File(root, 'world/greatwall/manifest/creation.json').isFile() ||
                    !new File(root, 'world/greatwall/manifest/world.json').isFile() ||
                    !new File(root, 'real-wall-generated.json').isFile()) {
                throw new GradleException('Reopen requires this isolated authorized production fixture and first traversal certificate')
            }
            logger.lifecycle("Reopening only this isolated real-wall fixture: ${root}")
            return
        }
        if (terrainResume) {
            if (!terrainProbe || !new File(root, 'greatwall_test_world').isFile() ||
                    !new File(root, 'world/greatwall-s0/recipes').isDirectory()) {
                throw new GradleException('Recovery is restricted to an identified S0 test world')
            }
            logger.lifecycle("Resuming this isolated S0 crash-recovery fixture: ${root}")
            return
        }
        if (new File(root, 'world').exists()) {
            throw new GradleException('Refusing an existing smoke world; choose a new smokeRunId')
        }
        root.mkdirs()
        new File(root, 'greatwall_test_world').setText("S0-01 ${profile} ${runId}\n", 'UTF-8')
        if (realWall) new File(root, 'greatwall_s1c_fixture').setText("S1C isolated real wall ${profile} ${runId}; production OFF\n", 'UTF-8')
        // The user explicitly authorized isolated dedicated-server startup tests.
        new File(root, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(root, 'server.properties').setText('''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-query=false
enable-rcon=false
level-seed=9282026
level-type=minecraft:normal
view-distance=2
simulation-distance=2
max-tick-time=60000
sync-chunk-writes=true
''', 'UTF-8')
        if (terrainProbe) {
            new File(root, 'server.properties').append('''level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","features":true,"lakes":false,"structure_overrides":[]}
spawn-protection=0
''', 'UTF-8')
        }
        if (realWall || seedSurvey) {
            new File(root, 'server.properties').append("level-seed=${actualSeed}\nspawn-protection=0\n", 'UTF-8')
        }
        if (providers.gradleProperty('s0Reload').getOrElse('none') != 'none') {
            def fixture = new File(root, 'world/datapacks/greatwall-s0')
            fixture.mkdirs()
            new File(fixture, 'pack.mcmeta').setText('{"pack":{"pack_format":48,"description":"S0 reload fixture"}}', 'UTF-8')
            def noise = new File(fixture, 'data/plaincraft_great_wall/worldgen/noise/probe_noise.json')
            noise.parentFile.mkdirs()
            noise.setText('{"firstOctave":-3,"amplitudes":[1.0]}', 'UTF-8')
        }
        logger.lifecycle("Isolated smoke directory: ${root}")
    }
}
def terrainWorkerAgent = tasks.register('terrainWorkerAgent', Jar) {
    dependsOn tasks.named('serverSmokeClasses')
    from(sourceSets.serverSmoke.output) { include 'local/plaincraft/greatwall/smoke/WorkerCountAgent*.class' }
    archiveClassifier = 'terrain-worker-agent'
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
    doFirst {
        def asm = sourceSets.serverSmoke.compileClasspath.files.findAll { it.name ==~ /asm-[0-9].*\.jar/ }
        if (asm.size() != 1) throw new GradleException('Expected one already locked ASM core for test-only agent')
        manifest.attributes('Premain-Class': 'local.plaincraft.greatwall.smoke.WorkerCountAgent',
                'Class-Path': asm[0].toURI().toASCIIString())
    }
}
tasks.named('runServerSmoke') {
    // The task timeout must outlast the fixture's own traversal budget, otherwise Gradle kills the
    // server mid-traversal and the failure looks like a crash rather than an exhausted budget. The
    // margin covers world load, plan preparation and the final report.
    timeout = java.time.Duration.ofMinutes(realWall ? traversalMinutes + 10 : seedSurvey || oracleOnly ? 20 : terrainProbe ? 10 : 3)
    dependsOn tasks.named('prepareServerSmoke')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(runtimeJava) }
    if (providers.gradleProperty('s0TerrainFixedWorkers').getOrElse('false').toBoolean() && profile == 'tectonic-c2me') {
        dependsOn terrainWorkerAgent
        doFirst { jvmArgs "-javaagent:${terrainWorkerAgent.get().archiveFile.get().asFile.absolutePath}" }
    }
}

def smokeJar = tasks.register('serverSmokeJar', Jar) {
    from sourceSets.serverSmoke.output
    archiveClassifier = 'server-smoke-dev'
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
}
def remapJarType = plugins.getPlugin('fabric-loom').class.classLoader.loadClass('net.fabricmc.loom.task.RemapJarTask')
def remappedSmoke = tasks.register('remapServerSmokeJar', remapJarType) {
    dependsOn smokeJar
    inputFile = smokeJar.flatMap { it.archiveFile }
    archiveClassifier = 'server-smoke'
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
    classpath.from(sourceSets.serverSmoke.compileClasspath)
    addNestedDependencies = false
    includesClientOnlyClasses = false
}

// Use already cached artifacts directly. Loom's installer-based production task
// can download outside Gradle's resolver, which is forbidden for this workflow.
def prepareProductionInputs = { runtimeSource, String gameJarName, File smokeFile, File stagingRoot = directory.get().asFile ->
    def gameJar = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/1.21.1/${gameJarName}")
    // Loom caches the intermediary artifact with a mapping-version suffix, e.g.
    // intermediary-1.21.1-v2.jar. Matching the bare 'intermediary-1.21.1.jar' name therefore found
    // nothing and every production run aborted with "Missing cached production game/intermediary",
    // even though the artifact was present. Match the version prefix and require exactly one.
    def intermediary = fileTree(new File(gradle.gradleUserHomeDir,
            'caches/modules-2/files-2.1/net.fabricmc/intermediary/1.21.1')).matching {
        include '**/intermediary-1.21.1*.jar'
        exclude '**/*-sources.jar'
    }.files
    if (!gameJar.isFile() || intermediary.size() != 1) {
        throw new GradleException('Missing cached production game/intermediary; downloads are forbidden')
    }
    def runtimeLibraries = runtimeSource.runtimeClasspath.files.findAll {
        def path = it.absolutePath.replace('\\', '/')
        path.contains('/modules-2/files-2.1/') && !path.contains('/net.fabricmc.fabric-api/') &&
                !it.name.startsWith('dev-launch-injector-')
    }
    def evidence = new groovy.json.JsonSlurper().parse(file('docs/evidence/s0-01/environment.json'))
    def api = evidence.artifacts.find { it.id == 'fabric-api' }
    def apiFile = file(api.path)
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    apiFile.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        for (int count; (count = stream.read(buffer)) != -1;) { digest.update(buffer, 0, count) }
    }
    if (digest.digest().encodeHex().toString() != api.sha256) {
        throw new GradleException('Local Fabric API differs from recorded locked artifact')
    }
    // 正式烟测的 mods 目录需要外置前置；开发期 named 包不能用于生产加载。
    def worldgenApi = new File(project.roadApiRoot, 'api-fabric/build/contract/roadweaver-api-intermediary.jar')
    if (!worldgenApi.isFile()) {
        throw new GradleException('缺独立前置的正式烟测包，请先在独立前置仓库执行 :api-fabric:contractIntermediaryJar')
    }
    def artifacts = [apiFile, worldgenApi, tasks.named('remapJar').get().archiveFile.get().asFile]
    if (smokeFile != null) artifacts.add(smokeFile)
    copy {
        from artifacts
        into new File(stagingRoot, 'mods')
    }
    return files(runtimeLibraries, gameJar, intermediary)
}
tasks.register('prepareSeedSurveyRuntime') {
    dependsOn tasks.named('remapJar'), remappedSmoke
    doLast {
        if (!seedSurvey || profile != 'vanilla') throw new GradleException('Explicit vanilla seed survey flag required')
        def root = directory.get().asFile
        if (new File(root, 'world').exists()) throw new GradleException('Runtime staging cannot reuse a world')
        root.mkdirs()
        def runtime = prepareProductionInputs(sourceSets.main, 'minecraft-extracted_server.jar',
                remappedSmoke.get().archiveFile.get().asFile)
        def description = [classpath: runtime.files.collect { it.absolutePath },
                mods: new File(root, 'mods').listFiles().findAll { it.name.endsWith('.jar') }
                        .collect { it.absolutePath }.sort(),
                javaHome: javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
                        .get().metadata.installationPath.asFile.absolutePath,
                purpose: 'read-only-root-hydrology-survey', productionWiring: 'OFF', networkUsed: false]
        new File(root, 'seed-survey-runtime.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(description)), 'UTF-8')
    }
}
tasks.register('runServerSmokeProduction', JavaExec) {
    // The timeout has to cover whichever profile was requested. A stress run is long by definition and
    // was previously cut off at the flat five-minute mark, so the ceiling is derived from the stress
    // duration when the stress switch is on, from the traversal budget for the real-wall fixture, and
    // keeps the short default otherwise. The margin covers world load, drain and the final report.
    def stressMinutesProp = providers.gradleProperty('s5StressMinutes').getOrElse('0').toLong()
    def stressSelected = providers.gradleProperty('s5Stress').getOrElse('false').toBoolean()
    timeout = java.time.Duration.ofMinutes(
            stressSelected ? stressMinutesProp + 20
                           : realWall ? traversalMinutes + 10
                                      : 5)
    dependsOn tasks.named('prepareServerSmoke'), tasks.named('remapJar'), remappedSmoke
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(runtimeJava) }
    workingDir = directory.get().asFile
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotServer'
    jvmArgs '-Xmx8G', '-Dfabric.development=false', '-Dfabric.noGui=true', "-Dgreatwall.smoke.profile=${profile}",
            '-Dmixin.debug.export=true', '-Dmixin.debug.export.decompile=false'
    jvmArgs probeArgs
    if (runtimeJava == 25) {
        jvmArgs '--enable-native-access=ALL-UNNAMED', '--add-modules=jdk.incubator.vector'
    }
    args '--nogui', '--port', '0', '--world', 'world'
    doFirst {
        classpath = prepareProductionInputs(sourceSets.main, 'minecraft-extracted_server.jar',
                remappedSmoke.get().archiveFile.get().asFile)
        logger.lifecycle("Production game runtime: ${javaLauncher.get().metadata.installationPath}")
        new File(directory.get().asFile, 'production-classpath.txt').setText(
                classpath.files.collect { it.absolutePath }.sort().join('\n') + '\n', 'UTF-8')
    }
}

def clientSmokeJar = tasks.register('clientSmokeJar', Jar) {
    from sourceSets.clientSmoke.output
    archiveClassifier = 'client-smoke-dev'
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
}
def remappedClientSmoke = tasks.register('remapClientSmokeJar', remapJarType) {
    dependsOn clientSmokeJar
    inputFile = clientSmokeJar.flatMap { it.archiveFile }
    archiveClassifier = 'client-smoke'
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
    classpath.from(sourceSets.clientSmoke.compileClasspath)
    addNestedDependencies = false
