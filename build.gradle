plugins {
    id 'fabric-loom' version '1.16.3'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

// 开发端用 Mojang named，正式服烟测改用同一项目的重映射前置；两者都不进长城成品。
ext.roadApiRoot = rootProject.file(providers.gradleProperty('worldgenApiProjectDir').orElse('../plaincraft-worldgen-api').get())

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 长城单独安装也能生成；道路仍只是可选协作者。
    def roadApiContract = new File(roadApiRoot, 'api/build/contract/roadweaver-api-contract-named.jar')
    def roadApiDevMod = new File(roadApiRoot, 'api-fabric/build/contract/roadweaver-api-fabric-devmod.jar')
    if (!roadApiContract.isFile() || !roadApiDevMod.isFile()) {
        throw new GradleException('缺云游四海世界生成 API，请先在独立前置仓库执行 :api:contractJar :api-fabric:devModJar')
    }
    compileOnly files(roadApiContract)
    // 状态契约由河流成品自己提供；长城只编译和测试，绝不重复打包可选API。
    def streamsPlanApi = rootProject.file("../streams-reflowing-src/build/contract/streams-plan-api.jar")
    if (!streamsPlanApi.exists()) throw new GradleException("缺河流状态契约，请先在streams-reflowing-src执行planContractJar")
    compileOnly files(streamsPlanApi)
    testImplementation files(streamsPlanApi)
    // dev 运行时（含 gametest 起的 dev 服务器）同样要满足 fabric.mod.json 的 depends，
    // 所以必须把契约 mod 真的装进去。**不是 compileOnly、也不会被打进产物**。
    modLocalRuntime files(roadApiDevMod)
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_platform_version}"
}

dependencyLocking {
    lockAllConfigurations()
    // 本地 API 每次重建都会改变 Loom 生成的版本；只豁免它，外部依赖继续锁定。
    ignoredDependencies.add('remapped.unspecified:roadweaver-api-fabric-devmod-*')
}

// Optional soft-dependency ABI jars (FTB quests/library/teams + Architectury) are
// local machine inputs, not Maven coordinates. Loom remaps them, so they land in
// compileClasspath under synthetic 'remapped.unspecified' ids that the frozen lock
// state never recorded. Their bytes are still verified by
// gradle/verification-metadata.xml, and gradle/ftb-quests.gradle re-checks each
// SHA before it is added, so nothing here weakens the artifact trust chain.
// The remapped ids appear in the compile classpaths (not the mod* configurations),
// so those classpaths are unlocked; all other configurations stay locked.
['compileClasspath', 'testCompileClasspath', 'gametestCompileClasspath',
 'clientCompileClasspath', 'clientSmokeCompileClasspath'].each { name ->
    configurations.matching { it.name == name }.configureEach {
        resolutionStrategy.deactivateDependencyLocking()
    }
}

loom {
    accessWidenerPath = file('src/main/resources/plaincraft_great_wall.accesswidener')
    splitEnvironmentSourceSets()
    mods {
        plaincraft_great_wall {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        server { runDir 'run/server' }
        client { runDir 'run/client' }
    }
}

// Soft dependency: Mod Menu is referenced only by the `modmenu` entrypoint and by
// the client config screen's factory. compileOnly keeps it out of the jar, so a
// session without Mod Menu simply never loads the entrypoint class.
//
// `modClientCompileOnly` rather than a plain file dependency: the published jar is
// in intermediary names, and this project compiles against Mojang mappings. Loom
// must remap it, or `ConfigScreenFactory` would expose `class_437` instead of
// `Screen` and the entrypoint would not type-check.
//
// This must stay AFTER the loom block: `splitEnvironmentSourceSets()` creates the
// `client` source set, and it does not exist while the earlier `dependencies`
// block is evaluated.
dependencies {
    def modMenu = file('libs/modmenu-compile-only.jar')
    if (modMenu.isFile()) {
        modClientCompileOnly files(modMenu)
    }
    // Soft dependency: Cloth Config is referenced only by the client config screen.
    // It ships as a separate jar in the pack's mods folder (cloth-config-15.0.140),
    // so compileOnly keeps it out of this jar; a session without it never loads the
    // screen factory. The same local-file pattern as modmenu keeps this off the
    // dependency-lock / verification-metadata.xml path entirely.
    def clothConfig = file('libs/cloth-config-compile-only.jar')
    if (clothConfig.isFile()) {
        modClientCompileOnly files(clothConfig)
    }
    def clothMath = file('libs/cloth-basic-math-compile-only.jar')
    if (clothMath.isFile()) {
        modClientCompileOnly files(clothMath)
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'plaincraft_great_wall_gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = false
        clearRunDirectory = false
    }
}

loom.runs.gameTest {
    vmArg '-Dfabric-api.gametest.report-file=../../reports/gametest/results.xml'
    def testHeap = providers.gradleProperty('greatwallTestHeap').orNull
    if (testHeap != null) {
        if (!(testHeap ==~ /[1-9][0-9]*[mMgG]/)) throw new GradleException('greatwallTestHeap must be a size such as 1024m')
        vmArg "-Xmx${testHeap}"
    }
}

sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + sourceSets.client.runtimeClasspath
    }
}

loom {
    mods {
        plaincraft_great_wall_client_smoke { sourceSet sourceSets.clientSmoke }
    }
    runs {
        clientSmoke {
            inherit client
            source sourceSets.clientSmoke
            runDir 'build/run/clientSmoke'
            programArgs '--username', 'GreatWallSmoke', '--width', '854', '--height', '480'
        }
    }
}

tasks.register('prepareClientSmoke') {
    doLast {
        def directory = layout.buildDirectory.dir('run/clientSmoke').get().asFile
        directory.mkdirs()
        def options = new File(directory, 'options.txt')
        if (!options.exists()) {
            options.setText('onboardAccessibility:false\nfullscreen:false\n', 'UTF-8')
        }
    }
}

tasks.named('runClientSmoke') { dependsOn tasks.named('prepareClientSmoke') }

tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_version', project.fabric_version
    filesMatching('fabric.mod.json') {
        expand(version: project.version, loader_version: project.loader_version,
                fabric_version: project.fabric_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test', Test) {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    testLogging { events 'passed', 'skipped', 'failed' }
}

apply from: 'gradle/windows-test-classpath.gradle'
apply from: 'gradle/dependency-evidence.gradle'
apply from: 'gradle/s0-probe.gradle'
apply from: 'gradle/ftb-quests.gradle'
apply from: 'gradle/smoke-tests.gradle'
apply from: 'gradle/production-tests.gradle'

tasks.named('runGameTest') {
    doFirst { layout.buildDirectory.dir('reports/gametest').get().asFile.mkdirs() }
}

// Explicit diagnostic selection changes only generated test resources, never the default suite.
tasks.named('processGametestResources') {
    def selection = providers.gradleProperty('greatwallGameTestClasses').orElse('')
    inputs.property('greatwallGameTestClasses', selection)
    doLast {
        def selected = selection.get().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
        if (!selected.isEmpty()) {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            def available = metadata.entrypoints['fabric-gametest']
            def unknown = selected.findAll { name -> !available.any { it.endsWith('.' + name) } }
            if (!unknown.isEmpty()) throw new GradleException("Unknown diagnostic GameTest classes: ${unknown}")
            metadata.entrypoints['fabric-gametest'] = available.findAll { entry -> selected.any { entry.endsWith('.' + it) } }
            metadataFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)), 'UTF-8')
            logger.lifecycle("DIAGNOSTIC SUBSET ONLY: ${selected}; not a full-stage acceptance run")
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
// 只含接口的极小 jar，给跨 mod 编译期使用（不参与部署）。
tasks.register('interopJar', Jar) {
    archiveBaseName = 'plaincraft-great-wall-interop'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('interop')
    from(sourceSets.main.output) {
        include 'local/plaincraft/greatwall/api/**'
    }
}
