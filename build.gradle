plugins {
    id 'fabric-loom' version '1.16.3'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Soft dependency: the RoadWeaver interop ABI is compile-only and never
    // bundled. The jar lives under libs/ so dependency locking stays untouched.
    def roadWeaverInterop = file('libs/roadweaver-interop-compile-only.jar')
    if (roadWeaverInterop.isFile()) {
        compileOnly files(roadWeaverInterop)
    }

    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_platform_version}"
}

dependencyLocking {
    lockAllConfigurations()
}

loom {
    accessWidenerPath = file('src/main/resources/plaincraft_great_wall.accesswidener')
    splitEnvironmentSourceSets()
    mods {
        plaincraft_great_wall {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        server { runDir 'run/server' }
        client { runDir 'run/client' }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'plaincraft_great_wall_gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = false
        clearRunDirectory = false
    }
}

loom.runs.gameTest {
    vmArg '-Dfabric-api.gametest.report-file=../../reports/gametest/results.xml'
    def testHeap = providers.gradleProperty('greatwallTestHeap').orNull
    if (testHeap != null) {
        if (!(testHeap ==~ /[1-9][0-9]*[mMgG]/)) throw new GradleException('greatwallTestHeap must be a size such as 1024m')
        vmArg "-Xmx${testHeap}"
    }
}

sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + sourceSets.client.runtimeClasspath
    }
}

loom {
    mods {
        plaincraft_great_wall_client_smoke { sourceSet sourceSets.clientSmoke }
    }
    runs {
        clientSmoke {
            inherit client
            source sourceSets.clientSmoke
            runDir 'build/run/clientSmoke'
            programArgs '--username', 'GreatWallSmoke', '--width', '854', '--height', '480'
        }
    }
}

tasks.register('prepareClientSmoke') {
    doLast {
        def directory = layout.buildDirectory.dir('run/clientSmoke').get().asFile
        directory.mkdirs()
        def options = new File(directory, 'options.txt')
        if (!options.exists()) {
            options.setText('onboardAccessibility:false\nfullscreen:false\n', 'UTF-8')
        }
    }
}

tasks.named('runClientSmoke') { dependsOn tasks.named('prepareClientSmoke') }

tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_version', project.fabric_version
    filesMatching('fabric.mod.json') {
        expand(version: project.version, loader_version: project.loader_version,
                fabric_version: project.fabric_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test', Test) {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    testLogging { events 'passed', 'skipped', 'failed' }
}

apply from: 'gradle/windows-test-classpath.gradle'
apply from: 'gradle/dependency-evidence.gradle'
apply from: 'gradle/s0-probe.gradle'
apply from: 'gradle/smoke-tests.gradle'

tasks.named('runGameTest') {
    doFirst { layout.buildDirectory.dir('reports/gametest').get().asFile.mkdirs() }
}

// Explicit diagnostic selection changes only generated test resources, never the default suite.
tasks.named('processGametestResources') {
    def selection = providers.gradleProperty('greatwallGameTestClasses').orElse('')
    inputs.property('greatwallGameTestClasses', selection)
    doLast {
        def selected = selection.get().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
        if (!selected.isEmpty()) {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            def available = metadata.entrypoints['fabric-gametest']
            def unknown = selected.findAll { name -> !available.any { it.endsWith('.' + name) } }
            if (!unknown.isEmpty()) throw new GradleException("Unknown diagnostic GameTest classes: ${unknown}")
            metadata.entrypoints['fabric-gametest'] = available.findAll { entry -> selected.any { entry.endsWith('.' + it) } }
            metadataFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)), 'UTF-8')
            logger.lifecycle("DIAGNOSTIC SUBSET ONLY: ${selected}; not a full-stage acceptance run")
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
