// 独立审计任务不进入发布 JAR，也不增加正式回归数量，避免把已知错误包装成守卫。
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def out = p.layout.buildDirectory.dir('deep-audit-probe')
    def compile = p.tasks.register('compileDeepAuditProbe', JavaCompile) {
        dependsOn p.tasks.named('testClasses')
        source p.file('scripts/audit/20261119/DeepAuditWallProbe.java')
        source p.file('scripts/audit/20261119/ProjectionIndexPrototype.java')
        classpath = p.sourceSets.test.runtimeClasspath
        destinationDirectory.set(out)
        options.encoding = 'UTF-8'
    }
    p.tasks.register('deepAuditProbe', JavaExec) {
        dependsOn compile, p.tasks.named('testClasspathBridge')
        // 沿用工程的清单桥，避免 Windows 中文工程路径破坏 JavaExec 的测试类路径。
        classpath = p.files(p.tasks.named('testClasspathBridge').flatMap { it.archiveFile }) + p.files(out)
        mainClass = 'local.plaincraft.greatwall.planning.DeepAuditWallProbe'
        jvmArgs '-Xmx2G'
    }
}
